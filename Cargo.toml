[package]
name = "memorylan"
version = "0.1.0"
edition = "2024"

[features]
default = []
serde = [
  "dep:serde",
  "dep:serde_bytes",
]

[dependencies]
indexmap = "2.14.1"
rand = "0.10.2"
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_bytes = { version = "0.11.19", optional = true }

[dev-dependencies]
memorylan = { path = ".", features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc"] }
